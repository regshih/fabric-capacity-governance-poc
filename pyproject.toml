[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-capacity-governance-poc"
version = "1.0.0"
description = "Microsoft Fabric capacity governance POC: pause/resume automation, Azure RBAC, and SKU restriction policy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "azure-identity>=1.17.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "bandit>=1.9.4", "pip-audit>=2.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that call live Azure (require RUN_AZURE_INTEGRATION_TESTS=true)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # long lines in documentation strings are acceptable here
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path bootstrap must run before package imports
